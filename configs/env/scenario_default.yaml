# configs/env/scenario_default.yaml
#
# QUY TẮC (T0.1): file này KHÔNG chứa giá trị số nào.
# Mọi giá trị tham chiếu tới configs/params_master.yaml (single source of truth)
# qua Hydra/OmegaConf interpolation.

name: "Reproduce_Paper_Fig9"
description: "Scenario 10 users, 1 MEC, 3 AVs theo [A] Section 6 / Fig.3"

# Flattened keys used directly by create_env_config
num_users: ${num_users.value}
num_mec_servers: ${num_mec_servers.value}
num_auxiliary_vehicles: ${num_auxiliary_vehicles.value}
num_attack_vehicles: ${num_attack_vehicles.value}
sim_area_x: ${sim_area_x.value}
sim_area_y: ${sim_area_y.value}
task_arrival_rate: ${task_arrival_rate.value}
task_size_min: ${task_size_min.value}
task_size_max: ${task_size_max.value}
task_cycles_per_bit: ${task_cycles_per_bit.value}
task_deadline: ${task_deadline_app.value}
dt: ${dt.value}
episode_length: ${episode_length.value}
v2v_range: ${v2v_range.value}

mec_cpu_frequency: ${mec_cpu_frequency.value}
aux_cpu_frequency: ${aux_cpu_frequency.value}
user_cpu_frequency: ${user_cpu_frequency.value}

# (Đã bỏ khối `simulation:` — trùng lặp với general.num_episodes / episode_length
#  và không được code nào đọc. Nguyên tắc T0.1: một con số một chỗ.)

channel:
  bandwidth_mec: ${bandwidth_mec.value}
  bandwidth_v2v: ${bandwidth_v2v.value}
  noise_power: ${noise_power.value}
  channel_gain: ${channel_ref_gain.value}
  ref_distance: ${channel_ref_distance.value}
  path_loss_exp: ${path_loss_exponent.value}

mec_server:
  count: ${num_mec_servers.value}
  coverage_radius: ${mec_coverage_radius.value}
  curb_distance: ${curb_distance.value}
  cpu_frequency: ${mec_cpu_frequency.value}
  base_price: ${mec_base_price.value}
  credibility: ${mec_credibility.value}
  bandwidth_pool: ${mec_bandwidth_pool.value}

users:
  count: ${num_users.value}
  velocity_min: ${velocity_min.value}
  velocity_max: ${velocity_max.value}
  tx_power: ${tx_power.value}
  idle_power: ${idle_power.value}
  task_size_min: ${task_size_min.value}
  task_size_max: ${task_size_max.value}
  cycles_per_bit: ${task_cycles_per_bit.value}
  max_delay: ${task_deadline_app.value}
  price_energy_local: ${price_energy_local.value}

aux_vehicles:
  count: ${num_auxiliary_vehicles.value}
  cpu_frequency: ${aux_cpu_frequency.value}
  base_price: ${aux_base_price.value}
  credibility: ${aux_credibility.value}
  price_energy_av: ${price_energy_av.value}
  bandwidth_pool: ${aux_bandwidth_pool.value}

mobility:
  type: "linear"         # linear hoặc sumo

# Mô hình attacker theo [B] Eq(5)-(9) — kỳ vọng mật độ, KHÔNG dựa trên thực thể
# (T0.2, T0.9). num_attack_vehicles chỉ để minh họa.
attack:
  count: ${num_attack_vehicles.value}
  density: ${attacker_density.value}
  lane_count: ${lane_count.value}
  road_max_speed_mps: ${road_max_speed.value}
  frame_length_bits: ${block_cipher_frame_length.value}
  encryption_block_length_bits: ${block_cipher_block_length.value}
  security_range_v2i: ${security_range_v2i.value}
  security_range_v2v: ${security_range_v2v.value}

# T1.1 — deadline động
deadline:
  floor: ${deadline_floor.value}
  urgency_cap: ${urgency_cap.value}

# T1.2/T1.3 — ràng buộc & penalty
constraints:
  energy_budget_max: ${energy_budget_max.value}
  penalty_mode: "fixed"          # "fixed" (baseline) | "external" (Lagrangian T1.3)
  deadline_penalty: ${deadline_penalty.value}
  energy_violation_penalty: ${energy_violation_penalty.value}

# T1.5 — đa user: users[1:] chạy Algorithm 1 của [A], chiếm tài nguyên thật
background:
  users_enabled: true            # Mức 2 (khuyến nghị)
  alpha_l: 0.5                   # T2.2 bước 3
  resource_level: 4
  load_enabled: false            # Mức 1 (chỉ khi users_enabled=false)
