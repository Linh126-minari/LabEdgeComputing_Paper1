# configs/security/paillier_params.yaml
#
# An ninh PHÂN VAI THEO ĐÍCH (17/09/2026, DANH_GIA_KIEN_TRUC_THEO_BAI_BAO.md §3.1):
#   MEC (server không tin cậy): Paillier HE [A] — server tính trên ciphertext, chống cả nghe lén → P_leak = 0
#   AUX (kênh V2V):            mã khối độ dài N_i [B] — P_leak = 1 − (N_i/N_f)^{nᵉ}
# Giá trị tham chiếu configs/params_master.yaml.

encryption:
  enabled: true
  scheme: "paillier"             # "paillier" (phân vai) | "aes" (cả hai nhánh mã khối, MEC giải mã) | "none"
  security_level: 1.0
  mode: "simulation"

  homomorphic:                    # nhánh MEC — [A]
    key_length_bits: ${homomorphic_key_length.value}
    cycles_per_bit: ${homomorphic_cycles_per_bit.value}

  block_cipher:                   # nhánh AUX — [B]
    frame_length_bits: ${block_cipher_frame_length.value}
    block_length_bits: ${block_cipher_block_length.value}
    cycles_per_bit: ${block_cipher_cycles_per_bit.value}
    round_factor: ${block_cipher_round_factor.value}
